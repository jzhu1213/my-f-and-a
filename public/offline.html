<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12121f" />
  <title>Folio — Offline</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #12121f;
      color: #f0eef6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 32px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .offline-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.7;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9375rem;
      color: rgba(240, 238, 246, 0.6);
      text-align: center;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 32px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #1a1a2e;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .allowance-section {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .allowance-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(240, 238, 246, 0.5);
      margin-bottom: 4px;
    }

    .allowance-amount {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #a78bfa;
    }

    .transactions-header {
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgba(240, 238, 246, 0.7);
      margin-bottom: 12px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .tx-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-description {
      font-size: 0.875rem;
      font-weight: 500;
      color: #f0eef6;
    }

    .tx-date {
      font-size: 0.75rem;
      color: rgba(240, 238, 246, 0.4);
    }

    .tx-amount {
      font-size: 0.875rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .tx-expense { color: #f87171; }
    .tx-income { color: #6ee7b7; }

    .empty-state {
      text-align: center;
      padding: 16px 0;
      color: rgba(240, 238, 246, 0.4);
      font-size: 0.8125rem;
    }

    .no-cache {
      text-align: center;
      color: rgba(240, 238, 246, 0.5);
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: #a78bfa;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .retry-btn:hover {
      background: rgba(167, 139, 250, 0.08);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="Folio" class="logo" />

  <!-- Offline cloud icon (inline SVG) -->
  <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2l20 20" />
    <path d="M9.3 5.03A7.5 7.5 0 0 1 19.77 10.2 5.5 5.5 0 0 1 21 20.5" />
    <path d="M4.2 10.83A7.5 7.5 0 0 0 3 12.5a7.49 7.49 0 0 0 1.1 3.91A5.5 5.5 0 0 0 6.5 21h10" />
  </svg>

  <h1>You're offline</h1>
  <p class="subtitle">No worries — your data is still here. Reconnect to sync and see everything.</p>

  <!-- Card with cached data -->
  <div id="data-card" class="card hidden">
    <div id="allowance-section" class="allowance-section hidden">
      <p class="allowance-label">Today's allowance</p>
      <p id="allowance-value" class="allowance-amount">—</p>
    </div>
    <div id="transactions-section">
      <p class="transactions-header">Recent transactions</p>
      <div id="transactions-list"></div>
    </div>
  </div>

  <!-- No cache fallback -->
  <div id="no-cache" class="no-cache hidden">
    <p>Once you're back online, your allowance and transactions will load right up.</p>
  </div>

  <button class="retry-btn" onclick="window.location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2v6h-6" /><path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
      <path d="M3 22v-6h6" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
    </svg>
    Try again
  </button>

  <script>
    (function() {
      try {
        // Find the home cache — keys are prefixed with "folio-home-cache-"
        var cacheData = null;
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.startsWith('folio-home-cache-')) {
            try {
              cacheData = JSON.parse(localStorage.getItem(key));
              break;
            } catch (e) { /* skip corrupted entries */ }
          }
        }

        if (!cacheData) {
          document.getElementById('no-cache').classList.remove('hidden');
          return;
        }

        document.getElementById('data-card').classList.remove('hidden');

        // Show allowance if available
        if (cacheData.allowance && typeof cacheData.allowance.amount === 'number') {
          var amount = cacheData.allowance.amount;
          document.getElementById('allowance-value').textContent =
            '$' + amount.toFixed(2);
          document.getElementById('allowance-section').classList.remove('hidden');
        }

        // Show recent transactions
        var txns = cacheData.recentTransactions || [];
        var listEl = document.getElementById('transactions-list');

        if (txns.length === 0) {
          listEl.innerHTML = '<p class="empty-state">No recent transactions cached</p>';
          return;
        }

        // Show up to 8 most recent
        var shown = txns.slice(0, 8);
        var html = '';
        for (var j = 0; j < shown.length; j++) {
          var tx = shown[j];
          var desc = tx.description || tx.category || 'Transaction';
          var dateStr = tx.date || '';
          var amountVal = typeof tx.amount === 'number' ? tx.amount : 0;
          var isIncome = tx.type === 'income';
          var amountClass = isIncome ? 'tx-income' : 'tx-expense';
          var sign = isIncome ? '+' : '-';
          var formattedAmount = sign + '$' + Math.abs(amountVal).toFixed(2);

          html += '<div class="transaction-item">' +
            '<div class="tx-left">' +
            '<span class="tx-description">' + escapeHtml(desc) + '</span>' +
            '<span class="tx-date">' + escapeHtml(formatDate(dateStr)) + '</span>' +
            '</div>' +
            '<span class="tx-amount ' + amountClass + '">' + formattedAmount + '</span>' +
            '</div>';
        }
        listEl.innerHTML = html;

      } catch (e) {
        // If anything fails, show the no-cache state
        document.getElementById('no-cache').classList.remove('hidden');
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
          var d = new Date(dateStr + 'T00:00:00');
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          return months[d.getMonth()] + ' ' + d.getDate();
        } catch (e) {
          return dateStr;
        }
      }
    })();
  </script>
</body>
</html>
